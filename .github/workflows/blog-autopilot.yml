name: Blog Autopilot

# Generates one bilingual (TR+EN) blog post about a recent AI/tech development,
# written from a founder's-perspective angle, using Claude Code billed against a
# Claude Max subscription (CLAUDE_CODE_OAUTH_TOKEN). Free — no API key.

on:
  schedule:
    - cron: "0 6 * * 1,3,5" # Mon/Wed/Fri 06:00 UTC (~09:00 Europe/Istanbul)
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: write # needed to push the generated post

concurrency:
  group: blog-autopilot
  cancel-in-progress: false

jobs:
  generate:
    # KILL-SWITCH: the job only runs when repo variable AUTOPILOT_ENABLED == 'true'.
    # Disable anytime by setting it to false (Settings → Secrets and variables → Actions → Variables).
    if: ${{ vars.AUTOPILOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute run date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate post with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: >-
            Today's date is ${{ steps.date.outputs.today }}.
            Read the file .github/autopilot/INSTRUCTIONS.md and follow it exactly
            to generate today's single blog post. Use ${{ steps.date.outputs.today }}
            as the publishedAt value. Write ONLY to src/data/autopilot-posts.json
            and .github/autopilot/seen.json. Do not run git or edit any other file.
          claude_args: "--allowedTools Read,Write,Edit,WebFetch,WebSearch --max-turns 40"

      - name: Validate generated content
        run: node scripts/autopilot/validate.mjs

      - name: Commit & push if changed
        run: |
          if [ -z "$(git status --porcelain src/data/autopilot-posts.json .github/autopilot/seen.json)" ]; then
            echo "No new post this run — nothing to commit."
            exit 0
          fi
          git config user.name "alianil-autopilot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/autopilot-posts.json .github/autopilot/seen.json
          git commit -m "chore(blog): autopilot post ${{ steps.date.outputs.today }}"
          git push
